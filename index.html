<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <title>Avalie seu filme aqui</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
